name: ci

on:
  push:
    paths:
      - 'src/**'
      - 'plugin-build/**'
      - 'mobile/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'plugin-build/**'
      - 'mobile/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: install
        run: pnpm install --frozen-lockfile --config.engine-strict=false
      - name: typecheck
        run: pnpm run typecheck
      - name: typecheck:test
        run: pnpm run typecheck:test
      - name: vitest
        run: pnpm exec vitest run
      - name: plugin tests
        run: node --test plugin-build/test/*.test.js
      - name: plugin package matches sources
        run: node scripts/check-plugin-sync.mjs

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: npm ci
        run: npm ci
      - name: test
        run: npm test
      - name: typecheck
        run: npm run typecheck
      - name: vite build
        run: npx vite build
      - uses: android-actions/setup-android@v3
      - name: Android platform
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: cap sync
        run: npx cap sync android
      - name: assembleDebug
        working-directory: mobile/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --console=plain
