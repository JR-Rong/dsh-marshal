<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, viewport-height" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#151719" />
  <meta name="format-detection" content="telephone=no" />
  <script>
    try {
      var savedTheme = localStorage.getItem('dsh-marshal-theme')
      if (savedTheme === 'blue' || savedTheme === 'purple' || savedTheme === 'gray') {
        document.documentElement.dataset.theme = savedTheme
      }
    } catch (error) { /* storage unavailable */ }
  </script>
  <title>调度官 · 手机端</title>
</head>
<body>
  <div id="app" class="app" role="application" aria-label="调度官手机端"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
